name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check both halves
        run: |
          node --check index.js
          node --check client.js

      - name: Fold semantics (host half)
        run: node test/fold-test.mjs

      - name: Features (ranges, comparison, cold tail)
        run: node test/features-test.mjs

      - name: Wallet balance outcome mapping
        run: node test/balance-test.mjs

      - name: Render smoke + regression checks (client half)
        run: |
          node test/client-smoke.cjs
          node test/review-check.cjs
